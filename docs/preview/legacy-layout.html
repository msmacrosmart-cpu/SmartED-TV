<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartED TV — prévia da interface</title>
<style>
  :root{
    --bg:#0B0F14; --surface:#151A1F; --surface2:#21262C; --surface3:#2E333A;
    --line:#33383F; --line-soft:#22272D;
    --fg:#F3F5F8; --fg2:#B2B8BE; --fg3:#7B8187;
    --accent:#EC92E5; --on-accent:#0B0F14;
    --ok:#65D49E; --warn:#F7C15F; --bad:#FF756F;
    --rail:76px; --pad:32px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#05070A; color:var(--fg);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* Moldura 16:9 como uma TV */
  #stage{
    position:relative; width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9; background:var(--bg); overflow:hidden;
    box-shadow:0 0 120px rgba(236,146,229,.08), 0 30px 80px rgba(0,0,0,.8);
  }
  #app{position:absolute; inset:0; display:flex}

  /* ---------- Side rail ---------- */
  nav#rail{
    width:var(--rail); flex:0 0 var(--rail); display:flex; flex-direction:column;
    align-items:center; gap:2px; padding:12px 0; background:var(--bg);
    border-right:1px solid var(--line-soft); z-index:30;
  }
  .rail-item{
    position:relative; width:54px; height:46px; border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--fg2); cursor:pointer; transition:all .16s var(--ease);
    border:none; background:transparent; font:inherit;
  }
  .rail-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .rail-item .key{position:absolute;top:3px;right:5px;font-size:9px;color:var(--fg3);
    font-weight:600;opacity:.65}
  .rail-item.active{background:var(--surface2);color:var(--accent)}
  .rail-item.active::before{content:"";position:absolute;left:-10px;top:50%;
    transform:translateY(-50%);width:3px;height:24px;border-radius:0 3px 3px 0;
    background:var(--accent)}
  .rail-item.focus{background:var(--surface3);color:var(--fg);
    box-shadow:0 0 0 3px var(--accent), 0 10px 24px rgba(0,0,0,.55)}
  .rail-spacer{flex:1}

  /* ---------- Main ---------- */
  main{flex:1; position:relative; overflow:hidden}
  .view{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    opacity:0; pointer-events:none; transition:opacity .22s var(--ease)}
  .view.active{opacity:1; pointer-events:auto}
  .view::-webkit-scrollbar{width:8px}
  .view::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px}

  /* Hero */
  .hero{position:relative; min-height:64%; display:flex; align-items:flex-end;
    padding:0 var(--pad) 26px}
  .hero-bg{position:absolute; inset:0;
    background-size:cover; background-position:center 35%}
  .hero-bg::after{content:""; position:absolute; inset:0;
    background:
      linear-gradient(90deg, var(--bg) 8%, rgba(11,15,20,.86) 42%, rgba(11,15,20,.15) 78%),
      linear-gradient(0deg, var(--bg) 2%, rgba(11,15,20,0) 55%)}
  .hero-content{position:relative; max-width:58%; display:flex;flex-direction:column;gap:12px;
    padding-bottom:6px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}
  .hero h1{font-size:clamp(28px,4.2vw,54px);line-height:1.03;letter-spacing:-.02em;
    font-weight:800}
  .hero .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    color:var(--fg2);font-size:13px}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--fg3)}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;
    border-radius:6px;border:1px solid var(--line);color:var(--fg2)}
  .star{color:var(--warn);font-weight:700}
  .hero p.syn{color:var(--fg2);font-size:13.5px;line-height:1.6;max-width:62ch;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .actions{display:flex;gap:10px;margin-top:6px}
  .btn{display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
    font:inherit;font-weight:700;font-size:13.5px;padding:11px 22px;border-radius:999px;
    transition:all .16s var(--ease);background:var(--surface2);color:var(--fg)}
  .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.focus{box-shadow:0 0 0 3px var(--accent);transform:scale(1.04)}
  .btn.primary.focus{box-shadow:0 0 0 3px #fff}

  /* Rails */
  section.rail{padding:0 0 22px}
  .rail-head{display:flex;align-items:baseline;gap:10px;padding:0 var(--pad) 12px}
  .rail-head h2{font-size:17px;font-weight:750;letter-spacing:-.01em}
  .rail-head span{font-size:12px;color:var(--fg3)}
  .rail-head .more{margin-left:auto;font-size:12px;color:var(--fg3)}
  .strip{display:flex;gap:14px;overflow-x:auto;padding:4px var(--pad) 8px;
    scrollbar-width:none;scroll-behavior:smooth}
  .strip::-webkit-scrollbar{display:none}

  .card{position:relative;flex:0 0 auto;border-radius:14px;overflow:hidden;
    cursor:pointer;transition:transform .18s var(--ease), box-shadow .18s var(--ease);
    background:var(--surface);outline:none;border:none;padding:0;text-align:left;color:inherit;
    font:inherit}
  .card img{display:block;width:100%;height:100%;object-fit:cover}
  .card.poster{width:168px;aspect-ratio:2/3}
  .card.wide{width:268px;aspect-ratio:16/9}
  .card.channel{width:196px;aspect-ratio:16/9;border-radius:12px}
  .card.focus{transform:scale(1.045);box-shadow:0 0 0 3px var(--accent),
    0 18px 40px rgba(0,0,0,.6);z-index:5}
  .card .label{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 9px;
    background:linear-gradient(0deg, rgba(4,6,9,.95), rgba(4,6,9,0));
    font-size:12.5px;font-weight:650;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .progress{position:absolute;left:0;right:0;bottom:0;height:3px;
    background:rgba(255,255,255,.16)}
  .card .progress i{display:block;height:100%;background:var(--accent)}
  .card .live{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;
    gap:5px;background:rgba(4,6,9,.82);padding:3px 8px;border-radius:999px;
    font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--bad)}
  .card .live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--bad);
    animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .card .now{position:absolute;left:0;right:0;bottom:34px;padding:0 10px;
    font-size:10.5px;color:var(--fg2)}
  .card .now b{color:var(--fg);font-weight:650}

  /* Categorias / chips */
  .chips{display:flex;gap:8px;padding:0 var(--pad) 16px;flex-wrap:wrap}
  .chip{border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;
    background:var(--surface);color:var(--fg2);border:1px solid var(--line-soft);
    cursor:pointer;transition:all .16s var(--ease);font-family:inherit}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .chip.focus{box-shadow:0 0 0 3px var(--accent)}
  .chip small{opacity:.6;margin-left:6px;font-weight:600}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:18px 14px;padding:0 var(--pad) 48px}
  .grid .card.poster{width:auto;aspect-ratio:2/3}

  /* Página */
  .page-head{padding:22px var(--pad) 18px;display:flex;align-items:flex-end;gap:14px}
  .page-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .page-head p{color:var(--fg3);font-size:12.5px;margin-top:4px}

  /* Ajustes */
  .settings{display:grid;grid-template-columns:220px 1fr;gap:26px;
    padding:0 var(--pad) 40px}
  .set-nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:0}
  .set-nav button{display:flex;align-items:center;gap:10px;padding:10px 13px;
    border-radius:10px;background:transparent;border:none;color:var(--fg2);
    font:inherit;font-size:13px;cursor:pointer;text-align:left;transition:.15s var(--ease)}
  .set-nav button.on{background:var(--surface2);color:var(--fg);font-weight:650}
  .set-nav button.focus{box-shadow:0 0 0 3px var(--accent);background:var(--surface3);color:var(--fg)}
  .panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;
    padding:20px 22px;margin-bottom:14px}
  .panel h3{font-size:14.5px;font-weight:750;margin-bottom:4px}
  .panel .hint{font-size:12px;color:var(--fg3);line-height:1.55;margin-bottom:14px}
  .field{display:flex;align-items:center;gap:10px;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    margin-bottom:10px;transition:.16s var(--ease)}
  .field .k{font-size:11px;color:var(--fg3);min-width:88px;text-transform:uppercase;
    letter-spacing:.07em;font-weight:700}
  .field .v{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg)}
  .field.focus{box-shadow:0 0 0 3px var(--accent);border-color:transparent;
    background:var(--surface3)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:750;
    padding:4px 10px;border-radius:999px;letter-spacing:.03em}
  .pill.ok{background:rgba(101,212,158,.14);color:var(--ok)}
  .pill.warn{background:rgba(247,193,95,.14);color:var(--warn)}
  .pill.bad{background:rgba(255,117,111,.14);color:var(--bad)}
  .accent-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:none;
    transition:transform .16s var(--ease);position:relative}
  .swatch.focus{transform:scale(1.22);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
  .swatch.sel::after{content:"";position:absolute;inset:-4px;border-radius:50%;
    border:2px solid var(--fg)}

  /* Addons */
  .addon-row{display:flex;align-items:center;gap:14px;padding:14px 16px;
    border-radius:14px;background:var(--surface);border:1px solid var(--line-soft);
    margin-bottom:10px;transition:.16s var(--ease)}
  .addon-row.focus{box-shadow:0 0 0 3px var(--accent);background:var(--surface2)}
  .addon-ico{width:44px;height:44px;border-radius:11px;flex:0 0 44px;
    display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--on-accent);
    background:linear-gradient(140deg,var(--accent),#8f5ac9)}
  .addon-row .t{flex:1;min-width:0}
  .addon-row .t b{display:block;font-size:13.5px;margin-bottom:2px}
  .addon-row .t span{font-size:11.5px;color:var(--fg3);display:block;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .toggle{width:38px;height:22px;border-radius:999px;background:var(--surface3);
    position:relative;flex:0 0 38px;transition:.18s var(--ease)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;
    border-radius:50%;background:var(--fg2);transition:.18s var(--ease)}
  .toggle.on{background:var(--accent)}
  .toggle.on::after{left:19px;background:var(--on-accent)}

  /* Guia EPG */
  .epg{display:flex;flex-direction:column;padding-bottom:40px}
  .epg-row{display:flex;border-bottom:1px solid var(--line-soft);min-height:58px}
  .epg-ch{width:132px;flex:0 0 132px;padding:10px 12px;font-size:12px;font-weight:700;
    display:flex;align-items:center;gap:8px;background:var(--bg);position:sticky;left:0;z-index:2;
    border-right:1px solid var(--line-soft)}
  .epg-ch i{width:22px;height:22px;border-radius:6px;flex:0 0 22px;
    background:linear-gradient(140deg,var(--surface3),var(--surface2))}
  .epg-progs{display:flex;flex:1}
  .prog{padding:10px 12px;border-right:1px solid var(--line-soft);font-size:11.5px;
    display:flex;flex-direction:column;gap:3px;justify-content:center;cursor:pointer;
    transition:.15s var(--ease)}
  .prog b{font-weight:650;font-size:12px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .prog span{color:var(--fg3);font-size:10.5px}
  .prog.now{background:rgba(236,146,229,.07)}
  .prog.now b{color:var(--accent)}
  .prog.focus{box-shadow:inset 0 0 0 3px var(--accent);background:var(--surface2)}
  .epg-now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);
    box-shadow:0 0 12px var(--accent);z-index:3}

  /* Detalhes */
  .details{position:relative;min-height:100%}
  .details .bd{position:absolute;inset:0;height:72%;
    background-size:cover;background-position:center 30%}
  .details .bd::after{content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,var(--bg) 4%,rgba(11,15,20,.55) 62%,rgba(11,15,20,.85)),
    linear-gradient(90deg,var(--bg) 0%,transparent 70%)}
  .details .inner{position:relative;padding:max(48px,8vh) var(--pad) 40px;
    display:grid;grid-template-columns:200px 1fr;gap:26px}
  .details .poster{width:200px;aspect-ratio:2/3;border-radius:16px;object-fit:cover;
    box-shadow:0 22px 50px rgba(0,0,0,.65);border:1px solid var(--line)}
  .details h1{font-size:clamp(24px,3.4vw,42px);line-height:1.05;font-weight:800;
    letter-spacing:-.02em;margin-bottom:10px}
  .stats{display:flex;gap:18px;margin:18px 0;flex-wrap:wrap}
  .stat b{display:block;font-size:16px;font-weight:750}
  .stat span{font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
  .cast{display:flex;gap:12px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .cast::-webkit-scrollbar{display:none}
  .person{flex:0 0 auto;width:82px;text-align:center}
  .person img{width:82px;height:82px;border-radius:50%;object-fit:cover;
    border:2px solid var(--line);display:block;margin-bottom:7px;transition:.16s var(--ease)}
  .person b{display:block;font-size:10.5px;font-weight:650;line-height:1.25}
  .person span{display:block;font-size:9.5px;color:var(--fg3);margin-top:2px}
  .person.focus img{box-shadow:0 0 0 3px var(--accent);transform:scale(1.06)}
  .section-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:750;
    text-transform:uppercase;letter-spacing:.12em;color:var(--fg2);margin:22px 0 12px}

  /* HUD */
  #hint{position:absolute;right:14px;bottom:12px;font-size:10.5px;color:var(--fg3);
    display:flex;gap:12px;align-items:center;z-index:40;pointer-events:none;
    opacity:.75;transition:opacity .3s}
  #hint kbd{background:var(--surface2);border:1px solid var(--line);border-radius:5px;
    padding:1.5px 5px;font-family:inherit;font-size:10px;color:var(--fg2)}
  #toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--surface3);border:1px solid var(--line);border-radius:999px;
    padding:9px 20px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;
    transition:.25s var(--ease);z-index:50;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* Splash */
  #splash{position:absolute;inset:0;background:var(--bg);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .45s var(--ease)}
  #splash.hide{opacity:0;pointer-events:none}
  .sp-logo{width:78px;height:78px;border-radius:22px;background:var(--surface2);
    display:grid;place-items:center;position:relative;
    animation:spIn .8s var(--ease) both}
  .sp-logo::before{content:"";position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(236,146,229,.25);animation:spRing 1.6s var(--ease) infinite}
  .sp-logo span{font-size:30px;color:var(--accent);animation:spPulse 1.6s ease-in-out infinite}
  @keyframes spIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  @keyframes spRing{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  @keyframes spPulse{0%,100%{opacity:1}50%{opacity:.55}}
  #splash h1{font-size:24px;font-weight:800;letter-spacing:-.01em;animation:spIn .8s .1s var(--ease) both}
  #splash p{font-size:12px;color:var(--fg3);animation:spIn .8s .2s var(--ease) both}
  .bars{display:flex;gap:4px;align-items:flex-end;height:22px;margin-top:4px}
  .bars i{width:4px;border-radius:2px;background:var(--accent);animation:bar 1.1s ease-in-out infinite}
  .bars i:nth-child(1){height:8px;animation-delay:0s}
  .bars i:nth-child(2){height:14px;animation-delay:.1s}
  .bars i:nth-child(3){height:20px;animation-delay:.2s}
  .bars i:nth-child(4){height:14px;animation-delay:.3s}
  .bars i:nth-child(5){height:8px;animation-delay:.4s}
  @keyframes bar{0%,100%{transform:scaleY(.45);opacity:.5}50%{transform:scaleY(1);opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <nav id="rail" aria-label="Navegação principal"></nav>
    <main id="main"></main>
  </div>
  <div id="hint">
    <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
    <span><kbd>Enter</kbd> abrir</span>
    <span><kbd>1</kbd>–<kbd>8</kbd> seções</span>
  </div>
  <div id="toast"></div>
  <div id="splash">
    <div class="sp-logo"><span>▶</span></div>
    <h1>SmartED TV</h1>
    <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
    <p id="spMsg">Carregando Brazuca Play…</p>
  </div>
</div>

<script>
/* ============================================================
   Dados de demonstração (mesmas formas do core Kotlin)
   ============================================================ */
const A = p => `art/${p}`;

const SECTIONS = [
  {id:'home',     label:'Início',  key:'1', icon:'home'},
  {id:'live',     label:'Canais',  key:'2', icon:'live'},
  {id:'movies',   label:'Filmes',  key:'3', icon:'movies'},
  {id:'series',   label:'Séries',  key:'4', icon:'series'},
  {id:'guide',    label:'Guia',    key:'5', icon:'guide'},
  {id:'search',   label:'Buscar',  key:'6', icon:'search'},
  {id:'addons',   label:'Addons',  key:'7', icon:'addon'},
  {id:'settings', label:'Ajustes', key:'8', icon:'settings'},
];

const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-6h4v6"/>',
  live:'<rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="m8 3 4 3 4-3"/><path d="M10.5 10.5v4.5l4-2.25z" fill="currentColor" stroke="none"/>',
  movies:'<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M2.5 9h19M2.5 15h19M7 4.5v15M17 4.5v15"/>',
  series:'<rect x="2.5" y="5" width="19" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 17v3"/><path d="M9.5 9v4l3.5-2z" fill="currentColor" stroke="none"/>',
  guide:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 4v16M14 4v16"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>',
  addon:'<path d="M10 3h4v3.2a3 3 0 1 0 0 6V15h3.2a3 3 0 1 0 0-6H21v4a3 3 0 1 1-6 0h-1v3.9a3 3 0 1 1-6 0V13H7a3 3 0 1 1 0-6h1V3z"/>',
  settings:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1 5.3 5.3"/>',
  play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',

function restoreAccent() {
  const saved = localStorage.getItem('smarted-accent');
  if (saved) state.accent = saved;
  document.documentElement.style.setProperty('--accent', state.accent);
}

function accentOn(hex) {
  // contraste simples: âmbar/lima/prata/branco pedem texto escuro
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? '#0B0F14' : '#0B0F14';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1900);
}

function renderRail() {
  rail.innerHTML = '';
  SECTIONS.forEach(s => {
    const b = el(`<button class="rail-item ${s.id===state.section?'active':''}" data-sec="${s.id}">
        <span class="key">${s.key}</span>
        <svg viewBox="0 0 24 24">${ICONS[s.icon]}</svg>
      </button>`);
    b.title = s.label;
    b.onclick = () => go(s.id);
    rail.appendChild(b);
  });
}

        <div class="meta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--fg2);font-size:13px">
          <span class="star">★ ${(m.r||8.2).toFixed(1)}</span><span class="dot"></span>
          <span>${m.y}</span><span class="dot"></span><span>${m.d?.split('· ')[1]||'1h 52min'}</span>
          <span class="badge">16</span><span class="badge">Dolby</span>
        </div>
        <p class="syn" style="margin-top:16px;max-width:70ch">Quando um sinal de rádio fora do ar
          começa a transmitir mensagens que ninguém deveria ouvir, uma analista de áudio e um
          técnico de torre precisam descobrir quem está do outro lado antes do próximo eclipse.</p>
        <div class="stats">
          <div class="stat"><b>${(m.r||8.2).toFixed(1)}</b><span>TMDB</span></div>
          <div class="stat"><b>91%</b><span>Relevância</span></div>
          <div class="stat"><b>2.4k</b><span>Votos</span></div>
          <div class="stat"><b>3</b><span>Fontes</span></div>
        </div>
        <div class="section-t">Elenco <span style="color:var(--fg3);font-weight:500;letter-spacing:0;text-transform:none">10 pessoas</span></div>
        <div class="cast">
          ${CAST.map(([n,r],k)=>`
            <div class="person" data-nav>
              <img src="${castSrc(k)}" alt="">
              <b>${n}</b><span>${r}</span>
            </div>`).join('')}
        </div>
        <div class="section-t">Temporadas</div>
        <div class="strip" style="padding-left:0;gap:10px">
          ${[1,2,3].map(t=>`
            <button class="chip ${t===1?'on':''}" data-nav style="padding:9px 17px">Temporada ${t} <small>${6+t*2} eps</small></button>`).join('')}
        </div>
        <div class="section-t">Semelhantes</div>
        <div class="strip" style="padding-left:0">
          ${MOVIES.slice(4,10).map((s,k)=>posterCardHtml(s,k+4)).join('')}
        </div>
      </div>
    </div>
  </div>`;
  renderInto('details', html, true);
}

/* ============================================================
   Render
   ============================================================ */
let activeView = 'home';
function renderInto(id, html, asOverlay=false) {
  document.querySelectorAll('.view').forEach(v=>{
    if (v.dataset.view===id) v.remove();
  });
  const v = el(`<div class="view" data-view="${id}">${html}</div>`);
  main.appendChild(v);
  requestAnimationFrame(()=>v.classList.add('active'));
  attachViewHandlers(v);
  state.focused = null;
}

function go(id) {
  if (id !== 'details') { document.querySelectorAll('[data-view="details"]').forEach(x=>x.remove()); }
  state.section = id === 'details' ? state.section : id;
  document.querySelectorAll('.view').forEach(v=>{
    if (v.dataset.view !== state.section && v.dataset.view !== 'details') {
      v.classList.remove('active');
      setTimeout(()=>{ if(!v.classList.contains('active')) v.remove(); }, 240);
    }
  });
  renderRail();
  const existing = document.querySelector(`.view[data-view="${state.section}"]`);
  if (existing) { existing.classList.add('active'); return; }
  renderInto(state.section, VIEWS[state.section] ? VIEWS[state.section]() : '');
}

function attachViewHandlers(root) {
  root.querySelectorAll('[data-accent]').forEach(b=>{
    b.onclick = () => {
      state.accent = b.dataset.accent;
      localStorage.setItem('smarted-accent', state.accent);
      document.documentElement.style.setProperty('--accent', state.accent);
      root.querySelectorAll('[data-accent]').forEach(x=>
        x.classList.toggle('sel', x.dataset.accent===state.accent));
      toast(`Acento: ${b.title}`);
    };
  });
  root.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = (e) => {
      const act = b.dataset.act;
      if (act==='play') toast('▶ Reproduzindo no player nativo (Media3)');
      if (act==='trailer') toast('Trailer do YouTube · sem anúncios');
      if (act==='list') toast('Adicionado à minha lista');
      if (act==='info') openDetails(MOVIES[detailIndex], detailIndex);
    };
  });
  root.querySelectorAll('.chip').forEach(c=>{
    c.onclick = () => {
      c.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
    };
  });
  root.querySelectorAll('.toggle').forEach(t=>{
    t.closest('.addon-row').onclick = () => {
      t.classList.toggle('on');
      toast(t.classList.contains('on') ? 'Addon ativado' : 'Addon desativado');
    };
  });
}

/* ============================================================
   Navegação por D-pad
   ============================================================ */
function navItems() {
  const scope = document.querySelector('.view.active') || main;
  return [...scope.querySelectorAll('[data-nav]')].filter(n=>n.offsetParent!==null);
}

function setFocus(node) {
  if (state.focused) state.focused.classList.remove('focus');
  state.focused = node;
  if (!node) return;
  node.classList.add('focus');
  const scroller = node.closest('.strip, .cast');
  if (scroller) {
    const r = node.getBoundingClientRect(), sr = scroller.getBoundingClientRect();
    if (r.left < sr.left + 8 || r.right > sr.right - 8) {
      scroller.scrollTo({left: scroller.scrollLeft + (r.left - sr.left) - 40, behavior:'smooth'});
    }
  } else {
    const view = node.closest('.view');
    if (view) {
      const r = node.getBoundingClientRect(), vr = view.getBoundingClientRect();
      if (r.top < vr.top + 60) view.scrollTo({top: view.scrollTop + (r.top - vr.top) - 90, behavior:'smooth'});
      else if (r.bottom > vr.bottom - 40) view.scrollTo({top: view.scrollTop + (r.bottom - vr.bottom) + 60, behavior:'smooth'});
    }
  }
}

function move(dir) {
  const items = navItems();
  if (!items.length) return;
  if (!state.focused || !items.includes(state.focused)) { setFocus(items[0]); return; }
  const cur = state.focused.getBoundingClientRect();
  const cx = cur.left + cur.width/2, cy = cur.top + cur.height/2;
  let best = null, bestScore = Infinity;
  for (const n of items) {
    if (n === state.focused) continue;
    const r = n.getBoundingClientRect();
    const nx = r.left + r.width/2, ny = r.top + r.height/2;
    const dx = nx - cx, dy = ny - cy;
    let primary, secondary;
    if (dir==='left'){ if (dx > -4) continue; primary = -dx; secondary = Math.abs(dy); }
    if (dir==='right'){ if (dx < 4) continue; primary = dx; secondary = Math.abs(dy); }
    if (dir==='up'){ if (dy > -4) continue; primary = -dy; secondary = Math.abs(dx); }
    if (dir==='down'){ if (dy < 4) continue; primary = dy; secondary = Math.abs(dx); }
    const score = primary + secondary * 3.2;
    if (score < bestScore) { bestScore = score; best = n; }
  }
  if (best) setFocus(best);
}

function activate() {
  if (state.focused) { state.focused.click(); }
  else { const items = navItems(); if (items.length) setFocus(items[0]); }
}

document.addEventListener('keydown', e=>{
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(k)) e.preventDefault();
  if (k==='ArrowLeft') move('left');
  else if (k==='ArrowRight') move('right');
  else if (k==='ArrowUp') move('up');
  else if (k==='ArrowDown') move('down');
  else if (k==='Enter' || k===' ') activate();
  else if (k==='Escape' || k==='Backspace') {
    document.querySelectorAll('[data-view="details"]').forEach(x=>x.remove());
    document.querySelectorAll('.view.active').forEach(x=>x.classList.remove('active'));
    go(state.section);
  }
  else if (/^[1-8]$/.test(k)) go(SECTIONS[+k-1].id);
});

   Boot
   ============================================================ */
restoreAccent();
renderRail();
renderInto('home', VIEWS.home());

}, 1750);
</script>
