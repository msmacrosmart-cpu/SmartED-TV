# ---------------------------------------------------------------------------
# SmartED TV — propriedades do Gradle
#
# ATENÇÃO: este arquivo é versionado. Nunca coloque segredos aqui.
# Chaves locais (TMDB, keystore) vão em ~/.gradle/gradle.properties ou em
# variáveis de ambiente lidas pelo CI.
# ---------------------------------------------------------------------------

# AndroidX / Jetifier
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build
# Obs.: o configuration-cache fica desligado de propósito — KSP/Room com
# AGP 8.7 ainda tem incompatibilidades intermitentes.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Evita OOM do KSP/Room em runners com pouca memória
ksp.useKSP2=false
