name: SmartED TV — APK Release assinado

# Pipeline enxuta (diretriz do projeto): SEM job de emulador, SEM travas rígidas de
# "qualidade aprovada". Um único job compila o APK de release assinado e o publica
# como GitHub Release com link de download direto. Testes de uso são feitos no
# aparelho real; `test/` continua disponível para rodar localmente quando útil.

"on":
  push:
    branches: ["arena/80abb3ad-smarted-tv", "arena/f8d4f8cd-smarted-tv", "arena/962c30bf-smarted-tv"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smarted-${{ github.ref }}
  cancel-in-progress: true

env:
  # versionCode monotônico (9000 + run) para que novas versões instalem como
  # atualização por cima das anteriores, com a mesma chave de assinatura.
  VERSION_CODE_BASE: "9000"

jobs:
  build-release:
    name: Compila e publica o APK da TV
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Calcula versionCode/versionName (shell; GH expressions não somam)
        run: |
          echo "ORG_GRADLE_PROJECT_versionCode=$(( ${VERSION_CODE_BASE:-9000} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_versionName=3.0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Gate de arquitetura (identidade/camadas — bloqueia)
        run: python3 tools/check_architecture.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore compatibility signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS_VALUE:-smarted}"
            } >> "$GITHUB_ENV"
          else
            python3 tools/ci_signing.py
          fi
      - name: assembleRelease (compilação limpa, sem gates)
        run: |
          set +e
          # Retry apenas para falha de download do wrapper (CDN do Gradle já retornou 504/timeout
          # várias vezes); erro de compilação real não é repetido.
          CODE=1
          for attempt in 1 2 3 4 5; do
            ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain 2>&1 | tee /tmp/build.log
            CODE=${PIPESTATUS[0]}
            if [[ $CODE -eq 0 ]]; then break; fi
            if ! grep -q "org.gradle.wrapper.GradleWrapperMain" /tmp/build.log; then break; fi
            echo "Download do Gradle falhou no CDN (504/timeout) — tentativa $attempt de 5; repetindo em 30s..."
            sleep 30
          done
          if [[ $CODE -ne 0 ]]; then
            python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/build.log').read_text(errors='replace')
          keep = [l for l in log.splitlines() if re.match(r'^e: |^\* What went wrong|^> Task .*FAILED|^FAILURE:|^\* Exception', l)]
          chunk = ('\n'.join(keep) or log[-8000:])[:13000]
          def enc(s): return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for i in range(0, len(chunk), 3200):
              print('::error title=build [' + str(i // 3200 + 1) + ']::' + enc(chunk[i:i + 3200]))
          PY
            exit "$CODE"
          fi
      - name: Confere assinatura e empacota
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SmartED-TV-3.0.0.${{ github.run_number }}.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -x "$BT/apksigner" ]]; then "$BT/apksigner" verify --print-certs dist/*.apk || true; fi
          if [[ -x "$BT/aapt2" ]]; then "$BT/aapt2" dump badging dist/*.apk | grep -E "package:|sdkVersion|targetSdkVersion|leanback" || true; fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -la dist/
      - name: APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: SmartED-TV-release-apk
          path: dist/
          if-no-files-found: error
      - name: Publica release com link direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v3.0.0.${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --latest \
            --title "SmartED TV 3.0.0.${{ github.run_number }}" \
            --notes "APK Release assinado com a chave de compatibilidade (instala como atualização por cima das versões SmartED anteriores). Compilação direta via ./gradlew assembleRelease — pipeline sem travas de qualidade/emulador, conforme diretriz. Instalar: baixar o .apk na TV (app Downloader) ou \`adb install -r\`. SHA256 em SHA256SUMS.txt."
      - name: Testes unitários e lint (informativo — não bloqueia a publicação)
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2 --console=plain
