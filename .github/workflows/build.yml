name: Build & Release APK

# Compila o app na nuvem a cada push e publica o APK de release nas Releases
# do repositório. Também roda em pull requests (sem publicar) e sob demanda.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar o APK nas Releases"
        type: boolean
        default: true
      minify:
        description: "Rodar R8/minify no release (desligue para diagnosticar)"
        type: boolean
        default: true

# Um build por branch/PR; pushes novos cancelam o anterior.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # necessário para criar/atualizar a Release e enviar o APK

jobs:
  # ---------------------------------------------------------------------------
  # 1) Testes do núcleo puro (rápidos, sem Android SDK) — falha cedo
  # ---------------------------------------------------------------------------
  verify:
    name: Núcleo (parsers e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar kotlinc 2.0.21
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlin/kotlinc/bin/kotlinc" -version
      - name: Instalar ferramentas de verificação
        run: npm ci --no-audit --no-fund
      - name: Linters estáticos (sintaxe, imports, Compose)
        run: |
          node tools/kt-check.mjs app/src
          python3 tools/check-refs.py
          python3 tools/check-imports.py
          python3 tools/check-compose.py
          python3 tools/check-symbols.py
      - name: Testes do núcleo (67 asserções)
        run: bash tools/verify-core.sh
      - name: Typecheck do núcleo não-UI
        run: bash tools/verify-logic.sh

  # ---------------------------------------------------------------------------
  # 2) Build do APK
  # ---------------------------------------------------------------------------
  build:
    name: APK de release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      apk_name: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Definir versão
        id: version
        run: |
          set -euo pipefail
          # versionCode = número do run: sempre crescente no repositório, o que
          # permite atualizar o app por cima da versão anterior (o Android
          # recusa instalar um versionCode menor).
          CODE="${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            TAG="v${NAME}"
            PUBLISH_KIND="tag"
          else
            BASE=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || echo "1.0.0")
            NAME="${BASE}.${GITHUB_RUN_NUMBER}"
            # push em branch/publicação manual sobrescreve uma release "rolante",
            # em vez de criar uma release nova a cada commit
            TAG="latest-build"
            PUBLISH_KIND="rolling"
          fi

          APK="SmartED-TV-${NAME}-release.apk"
          {
            echo "name=${NAME}"
            echo "code=${CODE}"
            echo "apk=${APK}"
            echo "tag=${TAG}"
            echo "kind=${PUBLISH_KIND}"
          } >> "$GITHUB_OUTPUT"
          echo "→ versão ${NAME} · versionCode ${CODE} · tag ${TAG}"

      - name: Preparar keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "→ keystore do repositório (assinado com chave estável)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK sem assinatura estável::Configure os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD. O APK será assinado com o debug keystore e não poderá ser atualizado por cima de uma versão anterior."
          fi

      - name: Build release
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon --stacktrace --warning-mode=all \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -Pminify="${{ github.event.inputs.minify || 'true' }}"

      - name: Localizar e normalizar APK
        id: apk
        run: |
          set -euo pipefail
          FOUND=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [[ -z "$FOUND" ]]; then echo "::error::APK não encontrado"; exit 1; fi
          mkdir -p dist
          cp "$FOUND" "dist/${{ steps.version.outputs.apk }}"
          # sempre com a mesma chave: o fallback do AGP é o debug keystore
          echo "→ $(ls -lh dist/ | tail -1)"

      - name: Verificar APK (assinatura e metadados)
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          BTDIR="$ANDROID_HOME/build-tools/$BT"
          APK="dist/${{ steps.version.outputs.apk }}"
          echo "== build-tools $BT =="

          # aapt2 dump badging: pacote, SDKs, rótulo
          "$BTDIR/aapt2" dump badging "$APK" \
            | grep -E "^package:|sdkVersion|targetSdkVersion|application-label" || true

          if [[ "${{ steps.keystore.outputs.signed }}" == "true" ]]; then
            # apksigner é um script shell + jar no build-tools
            if [[ -x "$BTDIR/apksigner" ]]; then
              "$BTDIR/apksigner" verify --print-certs "$APK" | head -8
            elif [[ -f "$BTDIR/lib/apksigner.jar" ]]; then
              java -jar "$BTDIR/lib/apksigner.jar" verify --print-certs "$APK" | head -8
            else
              echo "::warning::apksigner não encontrado em $BTDIR; pulando verificação de assinatura"
            fi
          else
            echo "APK sem keystore de release; assinatura não verificada."
          fi

          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ steps.version.outputs.name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publicar nas Releases
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.kind == 'tag' && format('SmartED TV {0}', steps.version.outputs.name) || format('SmartED TV — build mais recente ({0})', steps.version.outputs.name) }}
          body: |
            ## SmartED TV ${{ steps.version.outputs.name }}

            APK de release gerado automaticamente pelo GitHub Actions.

            | | |
            |---|---|
            | **versionName** | `${{ steps.version.outputs.name }}` |
            | **versionCode** | `${{ steps.version.outputs.version_code }}` |
            | **Commit** | `${{ github.sha }}` |
            | **Assinatura** | ${{ steps.keystore.outputs.signed == 'true' && 'chave do projeto (atualizável)' || '⚠️ debug keystore — configure os secrets' }} |

            ### Instalar
            ```bash
            adb install -r ${{ steps.version.outputs.apk }}
            ```
            Ou baixe o APK no dispositivo e permita "instalar de fontes desconhecidas".
            Em Android TV, use o app *Downloader* ou `adb connect`.

            O arquivo `SHA256SUMS.txt` acompanha a release para conferência.
          files: |
            dist/${{ steps.version.outputs.apk }}
            dist/SHA256SUMS.txt
          draft: false
          prerelease: ${{ steps.version.outputs.kind != 'tag' }}
          make_latest: ${{ steps.version.outputs.kind == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
