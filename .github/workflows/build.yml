name: SmartED TV — qualidade e APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar uma release somente após todos os testes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smarted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilação, tipagem, lint e testes JVM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Architecture gate
        run: python3 tools/check_architecture.py
      - name: Kotlin compile + JVM tests + Android lint
        run: |
          set -o pipefail
          ./gradlew --max-workers=2 :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=2.0.0.${{ github.run_number }} 2>&1 | tee build.log
      - name: Annotate compiler/test failures
        if: failure()
        run: python3 tools/ci_report.py build.log
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/
          if-no-files-found: error

  tv-tests:
    name: Android TV real — D-Pad, manifesto HTTP e player
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-tv-30-x86_64-v2
      - name: Run Android TV instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -o pipefail
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee tv-build.log
            adb exec-out run-as com.smarted.tv.debug cat files/tv-player.png > app/build/tv-player.png || true
      - name: Annotate TV failures
        if: failure()
        run: python3 tools/ci_report.py tv-build.log
      - name: Upload TV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/tv-player.png
          if-no-files-found: ignore

  release-candidate:
    name: APK assinado — somente com qualidade aprovada
    needs: [verify, tv-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore compatibility signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS_VALUE:-smarted}"
            } >> "$GITHUB_ENV"
          else
            python3 tools/ci_signing.py
          fi
      - name: Build signed release
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=2.0.0.${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SmartED-TV-2.0.0.${{ github.run_number }}.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose dist/*.apk
          "$BT/aapt2" dump badging dist/*.apk | grep -E "package:|sdkVersion|targetSdkVersion|leanback|launchable-activity"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartED-TV-validated-apk
          path: dist/
          if-no-files-found: error
      - name: Publish explicitly requested release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.0.${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --title "SmartED TV 2.0.0.${{ github.run_number }}" --notes "Reconstrução Stremio nativa. Compilação Kotlin, testes JVM, lint e testes instrumentados Android TV aprovados antes desta publicação. APK assinado; confira SHA256SUMS.txt."
