name: SmartED TV — qualidade e APK

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar uma release somente após todos os testes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smarted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilação, tipagem, lint e testes JVM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_versionName: 3.0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Architecture gate
        run: python3 tools/check_architecture.py
      - name: Kotlin compile
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: JVM tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Assemble debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Upload debug APK for direct TV testing
        uses: actions/upload-artifact@v7
        with:
          name: SmartED-TV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android lint
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Assemble release APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Annotate compiler/test/lint failures
        if: failure()
        run: |
          python3 tools/ci_report.py build.log
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path in Path('app/build/test-results').glob('**/*.xml'):
              for case in ET.parse(path).getroot().findall('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = (failure.get('message') or '') + '\n' + (failure.text or '')
                      print('::error title=JUnit failure::' + message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:3000])
          for name in ('lint-results-debug.txt', 'lint-results-debug.xml'):
              path = Path('app/build/reports') / name
              if path.exists():
                  print(f'--- {path} ---')
                  print(path.read_text(errors='replace')[:55000])
          PY
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Candidate APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/
          if-no-files-found: error

  tv-tests:
    name: Android TV real — D-Pad, manifesto HTTP e player
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error title=Android TV::KVM não está disponível neste runner; o emulador x86_64 não pode iniciar.'
            exit 1
          fi
          ls -l /dev/kvm
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-tv-30-x86_64-v2
      - name: Run Android TV instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/run_tv_tests.sh
      - name: Annotate TV failures
        if: failure()
        run: |
          set +e
          python3 tools/ci_report.py tv-build.log
          python3 - <<'PY2'
          import glob, subprocess
          from pathlib import Path
          def tail(path, n=1400):
              try: return Path(path).read_text(errors='replace')[-n:]
              except OSError: return ''
          def sh(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True).stdout[-1200:]
          chunks = []
          for pat in ('/home/runner/.android/**/emulator*.log', '/home/runner/.android/**/*boot*.log', '/tmp/emulator*.log'):
              for f in glob.glob(pat, recursive=True)[:2]:
                  chunks.append((f, tail(f)))
          chunks.append(('df/free', sh('df -h / | tail -1; free -m | head -2')))
          chunks.append(('procs', sh('pgrep -af qemu | head -3; pgrep -af emulator | head -3')))
          def enc(s): return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for name, body in chunks:
              if body.strip():
                  print('::error title=TVdiagnostic ' + name.replace(' ', '_') + '::' + enc(body)[:3400])
          PY2
          echo '::group::TV host diagnostics'
          uname -a
          ls -l /dev/kvm 2>&1
          adb devices 2>&1
          find "$HOME/.android/avd" -maxdepth 2 -type f -name '*.ini' -print -exec cat {} \; 2>&1
          echo '::endgroup::'
      - name: Collect stray logs
        if: always()
        run: |
          set +e
          mkdir -p app/build/tvevidence
          cp tv-build.log app/build/tvevidence/ 2>/dev/null
          python3 - <<'PY3'
          import glob, pathlib, subprocess
          def enc(s): return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def emit(name, body):
              body = body.strip()
              if not body: return
              for i in range(0, min(len(body), 13000), 3400):
                  print(f'::error title=TVlog {name} [{i//3400}]::' + enc(body[i:i+3400]))
          emit('tv-build', pathlib.Path('tv-build.log').read_text(errors='replace')[-13000:] if pathlib.Path('tv-build.log').exists() else '')
          emit('runner-temp', subprocess.run(
              'find "$RUNNER_TEMP" -maxdepth 2 -name *.log -size +0c -exec tail -c 13000 {} ;',
              shell=True, capture_output=True, text=True).stdout[-13000:])
          emit('avd-dir', subprocess.run('ls -la ~/.android/avd 2>/dev/null; tail -c 9000 ~/.android/emulator-debug.log 2>/dev/null; tail -c 9000 ~/.android/avd/*/*log 2>/dev/null', shell=True, capture_output=True, text=True).stdout[-13000:])
          PY3
          find "$RUNNER_TEMP" -maxdepth 2 -name '*.log' -size +0c -exec head -c 200000 {} ';' > app/build/tvevidence/runner-temp-logs.txt 2>/dev/null
          find "$HOME/.android" -maxdepth 3 -type f \( -name '*.log' -o -name '*.txt' \) -exec sh -c 'echo "== $1"; tail -c 4000 "$1"' _ {} ';' > app/build/tvevidence/android-dir-logs.txt 2>/dev/null
          ls -la "$HOME/.android/avd" >> app/build/tvevidence/android-dir-logs.txt 2>/dev/null
          true
      - name: Upload TV evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/tv-player.png
            app/build/tv-logcat.txt
            app/build/tvevidence/
          if-no-files-found: ignore

  release-candidate:
    name: APK assinado — somente com qualidade aprovada
    needs: [verify, tv-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_versionName: 3.0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore compatibility signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS_VALUE:-smarted}"
            } >> "$GITHUB_ENV"
          else
            python3 tools/ci_signing.py
          fi
      - name: Build signed release
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SmartED-TV-2.0.0.${{ github.run_number }}.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/apksigner"
          test -x "$BT/aapt2"
          "$BT/apksigner" verify --verbose dist/*.apk
          "$BT/aapt2" dump badging dist/*.apk | grep -E "package:|sdkVersion|targetSdkVersion|leanback|launchable-activity"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Validated APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmartED-TV-validated-apk
          path: dist/
          if-no-files-found: error
      - name: Publish explicitly requested release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.0.${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --title "SmartED TV 2.0.0.${{ github.run_number }}" --notes "Reconstrução Stremio nativa. Compilação Kotlin, testes JVM, lint e testes instrumentados Android TV aprovados antes desta publicação. APK assinado; confira SHA256SUMS.txt."
