name: SmartED TV — qualidade e APK

"on":
  push:
    branches: ["arena/80abb3ad-smarted-tv"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar uma release somente após todos os testes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smarted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilação, tipagem, lint e testes JVM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_versionCode: ${{ 9000 + github.run_number }}
      ORG_GRADLE_PROJECT_versionName: 3.0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Architecture gate
        run: python3 tools/check_architecture.py
      - name: Kotlin compile
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: JVM tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Assemble debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Upload debug APK for direct TV testing
        uses: actions/upload-artifact@v7
        with:
          name: SmartED-TV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android lint
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Assemble release APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain --stacktrace 2>&1 | tee -a build.log
      - name: Annotate compiler/test/lint failures
        if: failure()
        run: |
          python3 tools/ci_report.py build.log
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path in Path('app/build/test-results').glob('**/*.xml'):
              for case in ET.parse(path).getroot().findall('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = (failure.get('message') or '') + '\n' + (failure.text or '')
                      print('::error title=JUnit failure::' + message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:3000])
          for name in ('lint-results-debug.txt', 'lint-results-debug.xml'):
              path = Path('app/build/reports') / name
              if path.exists():
                  print(f'--- {path} ---')
                  print(path.read_text(errors='replace')[:55000])
          PY
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Candidate APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/
          if-no-files-found: error

  release-candidate:
    name: APK assinado — somente com qualidade aprovada
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_versionCode: ${{ 9000 + github.run_number }}
      ORG_GRADLE_PROJECT_versionName: 3.0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore compatibility signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASS"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS_VALUE:-smarted}"
            } >> "$GITHUB_ENV"
          else
            python3 tools/ci_signing.py
          fi
      - name: Build signed release
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SmartED-TV-3.0.0.${{ github.run_number }}.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/apksigner"
          test -x "$BT/aapt2"
          "$BT/apksigner" verify --verbose dist/*.apk
          "$BT/aapt2" dump badging dist/*.apk | grep -E "package:|sdkVersion|targetSdkVersion|leanback|launchable-activity"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Validated APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SmartED-TV-validated-apk
          path: dist/
          if-no-files-found: error
      - name: Publish signed release (download imediato p/ instalar/atualizar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v3.0.0.${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --latest \
            --title "SmartED TV 3.0.0.${{ github.run_number }}" \
            --notes "APK assinado com a chave de compatibilidade do repositório (atualiza por cima de qualquer versão SmartED anterior da mesma chave). Pipeline: gate de arquitetura, compilação Kotlin sem warnings, testes JVM, lint e assembleRelease validado com apksigner. Instalar/atualizar: adb install -r SmartED-TV-3.0.0.${{ github.run_number }}.apk — SHA256 em SHA256SUMS.txt."
