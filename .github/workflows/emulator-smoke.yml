# Smoke test de EMULADOR (separado do build de publicação — não bloqueia):
# instala o APK, inicia o MainActivity, verifica crash e salva screenshot.
# Gatilho: editar .github/emulator-trigger (paths filter abaixo).
name: Emulador (smoke)

on:
  push:
    paths:
      - ".github/emulator-trigger"
  workflow_dispatch:

jobs:
  smoke:
    # ubuntu-latest migrou para 26.04 (out/2026) e quebra o emulator-runner;
    # fixamos a imagem estável enquanto a action não suporta a nova.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico do ambiente
        run: |
          echo "::notice::$(lsb_release -ds 2>/dev/null || uname -a)"
          ls -l /dev/kvm || echo "::notice::sem /dev/kvm"
          df -h / | tail -1

      - name: Enable KVM (exigido pela android-emulator-runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK de debug
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/build.log || {
            grep -E "^e: |error:|FAILURE:|Execution failed|Could not " /tmp/build.log \
              | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Instalar, iniciar e verificar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          # Lógica em script versionado (lintável localmente) — anota falhas.
          script: |
            set -e
            bash .github/scripts/emulator-smoke.sh
            bash .github/scripts/emulator-androidtest.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: artifacts/
          if-no-files-found: ignore
