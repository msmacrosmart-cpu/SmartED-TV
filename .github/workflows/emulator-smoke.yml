# Smoke test de EMULADOR (separado do build de publicação — não bloqueia):
# instala o APK, inicia o MainActivity, verifica crash e salva screenshot.
# Gatilho: editar .github/emulator-trigger (paths filter abaixo).
name: Emulador (smoke)

on:
  push:
    paths:
      - ".github/emulator-trigger"
  workflow_dispatch:

jobs:
  smoke:
    # ubuntu-latest migrou para 26.04 (out/2026) e quebra o emulator-runner;
    # fixamos a imagem estável enquanto a action não suporta a nova.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico do ambiente
        run: |
          echo "::notice::$(lsb_release -ds 2>/dev/null || uname -a)"
          ls -l /dev/kvm || echo "::notice::sem /dev/kvm"
          df -h / | tail -1

      - name: Enable KVM (exigido pela android-emulator-runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK de debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Instalar, iniciar e verificar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          # Diagnóstico via ::error:: (os logs do step não são acessíveis do
          # sandbox); cada comando reporta rc + saída numa annotation.
          script: |
            set -x
            rc=0
            out=$(adb install -r app/build/outputs/apk/debug/app-debug.apk 2>&1) || rc=$?
            printf '%s\n' "$out"
            case "$out" in
              *Success*) ;;
              *) echo "::error::adb install falhou rc=$rc :: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-700)"; exit 1 ;;
            esac
            rc=0
            out=$(adb shell am start -n com.smarted.tv.debug/com.smarted.tv.MainActivity 2>&1) || rc=$?
            printf '%s\n' "$out"
            case "$out" in
              *Error*|*"does not exist"*) rc=1 ;;
            esac
            if [ "$rc" -ne 0 ]; then echo "::error::am start falhou rc=$rc :: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-700)"; exit 1; fi
            sleep 15
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/emulator-smoke.png || echo "::error::screencap falhou"
            if adb logcat -d | grep -qi "FATAL EXCEPTION"; then
              echo "::error::CRASH detectado :: $(adb logcat -d | grep -A 40 'FATAL EXCEPTION' | tr '\n' ' ' | cut -c1-800)"
              exit 1
            fi
            echo "OK: app iniciou sem crash; screenshot salvo."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: artifacts/
          if-no-files-found: ignore
